server:
  port: 8085
spring:
  application:
    name: ms-usuarios
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/usuarios_db
    username: ${POSTGRES_USER:ecommerce}
    password: ${POSTGRES_PASSWORD:change_me_local_only}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
