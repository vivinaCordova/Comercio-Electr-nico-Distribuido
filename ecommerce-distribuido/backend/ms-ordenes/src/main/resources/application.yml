server:
  port: 8082
spring:
  application:
    name: ms-ordenes
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/ordenes_db
    username: ${POSTGRES_USER:ecommerce}
    password: ${POSTGRES_PASSWORD:change_me_local_only}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  flyway:
    enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:ecommerce}
    password: ${RABBITMQ_PASSWORD:change_me_rabbit}
catalogo:
  url: ${CATALOGO_URL:http://localhost:8081}
# Sin CORS propio: el API Gateway es la unica entrada y ya envia
# Access-Control-Allow-Origin. Si el servicio lo repite, el navegador
# rechaza la respuesta por tener el header duplicado.
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  file:
    name: ${LOG_FILE:logs/ms-ordenes.log}
  level:
    root: INFO
    com.ecommerce.ordenes: DEBUG
    org.springframework.amqp: INFO
    org.springframework.web.client.RestTemplate: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
