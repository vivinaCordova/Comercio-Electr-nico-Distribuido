
server:
  port: 8081

spring:
  application:
    name: ms-catalogo

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/catalogo_db
    username: ${POSTGRES_USER:ecommerce}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ecommerce}
    password: ${RABBITMQ_PASSWORD:}

management:
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
