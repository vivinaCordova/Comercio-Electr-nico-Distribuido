server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGIN:http://localhost:5173}"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
      routes:
        - id: catalogo
          uri: ${CATALOGO_URL:http://localhost:8081}
          predicates: [Path=/api/catalogo/**]
        - id: ordenes
          uri: ${ORDENES_URL:http://localhost:8082}
          predicates: [Path=/api/ordenes/**]
        - id: carrito
          uri: ${CARRITO_URL:http://localhost:8083}
          predicates: [Path=/api/carrito/**]
        - id: notificaciones
          uri: ${NOTIFICACIONES_URL:http://localhost:8084}
          predicates: [Path=/api/notificaciones/**]
management:
  endpoints:
    web:
      exposure:
        include: health,info
